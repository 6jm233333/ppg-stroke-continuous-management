[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-stroke-warning-prognosis"
version = "0.1.0"
description = "PPG waveform morphology code for stroke pre-recognition warning and post-admission prognosis stratification."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Cheng Ding"},
  {name = "Jiaming Liu"},
  {name = "Daoqiang Zhang"}
]
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "torch",
  "matplotlib",
  "seaborn",
  "tqdm",
  "pyyaml"
]

[project.optional-dependencies]
ehr = ["lightgbm", "xgboost", "shap", "imbalanced-learn"]
ppg = ["pyppg"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
